# Signs the apps and uploads them to TestFlight.
# Run it from the Actions tab, or push a tag such as v1.0.0 to ship both.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to ship
        type: choice
        default: ipad
        options: [ipad, mac, both]
  push:
    tags: ["v*"]

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PLATFORM: ${{ github.event.inputs.platform || 'both' }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen and fastlane
        run: |
          brew install xcodegen
          command -v fastlane || gem install fastlane --no-document

      - name: Generate Xcode project
        run: xcodegen generate

      # The two lanes run one after another so they never race to create
      # the same certificate in the certificates repo.
      - name: iPad build to TestFlight
        if: env.PLATFORM == 'ipad' || env.PLATFORM == 'both'
        run: fastlane ios beta

      - name: Mac build to TestFlight
        if: env.PLATFORM == 'mac' || env.PLATFORM == 'both'
        run: fastlane mac beta
