# XcodeGen spec. CI runs `xcodegen generate` to turn this into PortPlay.xcodeproj,
# so the project file never has to be edited by hand on Windows.
# BUNDLE_ID, TEAM_ID and BUILD_NUMBER come from environment variables set in the workflow.
#
# Both targets share the same source folder and the same bundle ID, so they become
# one App Store listing (universal purchase) with an iPad app and a Mac app.
# Signing identities and profiles are passed in by fastlane at build time.
name: PortPlay
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Manual
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_NAME: PortPlay
targets:
  PortPlay:
    type: application
    platform: iOS
    sources:
      - PortPlay
    scheme: {}
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Config/Info-iOS.plist
      properties:
        CFBundleDisplayName: PortPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: PortPlay shows the video from your USB HDMI capture dongle so you can play your console on this iPad.
        NSMicrophoneUsageDescription: PortPlay plays your console's game audio, which arrives through the capture dongle as a USB audio input.
        NSPhotoLibraryAddUsageDescription: PortPlay saves your screenshots, recordings and instant replays to Photos.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown

  PortPlayMac:
    type: application
    platform: macOS
    sources:
      - PortPlay
    scheme: {}
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Config/Info-macOS.plist
      properties:
        CFBundleDisplayName: PortPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: PortPlay shows the video from your USB HDMI capture dongle so you can play your console on this Mac.
        NSMicrophoneUsageDescription: PortPlay plays your console's game audio, which arrives through the capture dongle as a USB audio input.
        # Lets the website's "Open in Desktop" button open the app, like the Windows version
        CFBundleURLTypes:
          - CFBundleURLName: PortPlay
            CFBundleURLSchemes:
              - portplay
    entitlements:
      path: Config/PortPlay-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.device.usb: true
        com.apple.security.assets.pictures.read-write: true
        com.apple.security.assets.movies.read-write: true
